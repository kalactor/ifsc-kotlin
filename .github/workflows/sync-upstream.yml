name: sync-upstream-data

on:
  schedule:
    - cron: "0 3 1 * *"
  workflow_dispatch:
    inputs:
      tag:
        description: "Upstream tag, for example v2.0.62 (default: latest release)"
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Install Android SDK components
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      - name: Regenerate data from upstream
        run: ./tools/sync_upstream.sh "${{ inputs.tag }}"

      - name: Test regenerated data
        run: ./gradlew :core:test :offline:testDebugUnitTest --stacktrace

      - name: Open pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: chore/sync-ifsc-data
          commit-message: "chore: sync upstream IFSC data"
          title: "chore: sync upstream IFSC data"
          body: |
            Automated data sync from [razorpay/ifsc](https://github.com/razorpay/ifsc).

            Regenerated the core validation resource, the offline SQLite database,
            the metadata constants, and the validator fixture.
          add-paths: |
            core/src/main/resources/dev/ifsc/ifsc-core.bin
            core/src/test/resources/validator_asserts.json
            offline/src/main/assets/ifsc.db
            offline/src/main/kotlin/dev/ifsc/offline/IfscOfflineData.kt
